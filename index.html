<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>데블스 플랜: 데드 어게인 · The Devil's Plan: Dead Again</title>
    <meta
      name="description"
      content="기억 포커, 무거운 13 등 기억력·추리·수 싸움으로 승부하는 두뇌 게임 아카이브. AI 또는 로컬 대전으로 플레이하세요."
    />
    <meta property="og:title" content="데블스 플랜: 데드 어게인 · The Devil's Plan: Dead Again" />
    <meta
      property="og:description"
      content="기억 포커, 무거운 13 등 기억력·추리·수 싸움으로 승부하는 두뇌 게임 아카이브. AI 또는 로컬 대전으로 플레이하세요."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          if (/\/(memory-poker|heavy-13)\/$/.test(p)) {
            window.history.replaceState(
              null,
              '',
              p.replace(/\/$/, '') + window.location.search + window.location.hash
            );
          }
          var saved = localStorage.getItem('devils_plan_theme');
          if (saved !== 'light') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#eab308]/25 selection:text-[#1c1503] dark:selection:text-[#fef9c3]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
